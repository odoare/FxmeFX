name: Build macOS Universal

# Manual-only: run on demand from the Actions tab. Automatic builds on every
# commit are intentionally disabled — release artefacts are produced by
# release.yml on vx.y.z tags.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14  # Apple Silicon — Clang cross-compiles x86_64 too

    steps:
      - name: Checkout FxmeFX
        uses: actions/checkout@v4
        with:
          path: FxmeFX
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          # Pin to a specific JUCE release for reproducible builds.
          ref: 8.0.12
          path: JUCE

      - name: Configure CMake
        # The architecture and deployment settings are passed here as well as
        # being set in CMakeLists.txt, so a cached or overridden value cannot
        # quietly turn the release into a single-slice build.
        run: >
          cmake -B FxmeFX/build -S FxmeFX
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build (one plugin at a time)
        run: |
          for plugin in Compressor Equalizer Tube Transient StereoDelay ConvolReverb Cab Oct Limiter Freeze Chorus Flanger Phaser; do
            echo "::group::Build Fxme${plugin}"
            cmake --build FxmeFX/build --config Release --target "Fxme${plugin}_All" --parallel 2
            echo "::endgroup::"
          done

      - name: Build Pure Data externals
        run: |
          for plugin in Compressor Equalizer Tube Transient StereoDelay ConvolReverb Cab Oct Limiter Freeze Chorus Flanger Phaser; do
            echo "::group::Build Fxme${plugin} (Pd)"
            cmake --build FxmeFX/build --config Release --target "Fxme${plugin}_pd" --parallel 2
            echo "::endgroup::"
          done

      - name: Verify universal binaries
        # Must be able to fail: printing lipo -info happily reports a
        # single-slice build as a success and ships it.
        run: |
          fail=0
          for plugin in Compressor Equalizer Tube Transient StereoDelay ConvolReverb Cab Oct Limiter Freeze Chorus Flanger Phaser; do
            bin="FxmeFX/build/Source/${plugin}/Fxme${plugin}_artefacts/Release/VST3/Fxme${plugin}.vst3/Contents/MacOS/Fxme${plugin}"
            if [ ! -f "$bin" ]; then
              echo "::error::Fxme${plugin}: binary not found at $bin"
              fail=1
              continue
            fi
            archs=$(lipo -archs "$bin")
            echo "Fxme${plugin}: $archs"
            case " $archs " in *" arm64 "*)  ;; *) echo "::error::Fxme${plugin}: no arm64 slice";  fail=1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::Fxme${plugin}: no x86_64 slice"; fail=1 ;; esac
          done
          exit $fail

      - name: Upload VST3 artefacts
        uses: actions/upload-artifact@v4
        with:
          name: FxmeFX-VST3-macOS-universal
          path: FxmeFX/build/Source/*/Fxme*_artefacts/Release/VST3/

      - name: Upload AU artefacts
        uses: actions/upload-artifact@v4
        with:
          name: FxmeFX-AU-macOS-universal
          path: FxmeFX/build/Source/*/Fxme*_artefacts/Release/AU/

      - name: Upload Pd externals
        uses: actions/upload-artifact@v4
        with:
          name: FxmeFX-Pd-macOS-universal
          path: FxmeFX/build/Source/*/*.pd_darwin
